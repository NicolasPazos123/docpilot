[project]
name = "docpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolas", email = "nicolaspazos32@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
docpilot = "docpilot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
